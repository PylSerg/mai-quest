                currentGame.location = currentGame.locationName || currentGame.location || '';
            }
            dbSaveGame(currentGame);
            renderLocationsList();
        }

        function isCurrentLocationRecord(loc) {
            if (!currentGame || !loc) return false;
            const currentName = (currentGame.locationName || currentGame.location || '').trim().toLowerCase();
            return !!currentName && !!loc.name && loc.name.trim().toLowerCase() === currentName;
        }

        function deleteLocation(e, id) {
            e.stopPropagation();
            e.preventDefault();
            if (!currentGame || !Array.isArray(currentGame.locations)) return;

            const loc = currentGame.locations.find(l => l.id === id);
            const canDelete = !currentGame.isStarted || pendingManualLocationIds.includes(id) || !!loc?.pendingManualDeletion;
            if (!canDelete) {
                alert('Після початку гри цю локацію не можна видалити.');
                return;
            }
            const locName = loc ? (loc.name || 'цю локацію') : 'цю локацію';
            if (!confirm(`Видалити локацію "${locName}"?`)) return;
            currentGame.locations = currentGame.locations.filter(l => l.id !== id);
            pendingManualLocationIds = pendingManualLocationIds.filter(pid => pid !== id);
            dbSaveGame(currentGame);
            renderLocationsList();
        }

        function renderLocationsList() {
            const container = document.getElementById('locationsList');
            if (!container) return;
            container.innerHTML = '';
            if (!currentGame) return;
            if (!Array.isArray(currentGame.locations)) {
                currentGame.locations = [];
                if (currentGame.locationName || currentGame.location) {
                    currentGame.locations.push({
                        id: 'loc_' + Date.now(),
                        name: currentGame.locationName || currentGame.location,
                        description: currentGame.locationDescription || currentGame.location
                    });
                }
            }

            if (currentGame.locations.length === 0) {
                container.innerHTML = `<div style="font-size: 13px; color: var(--text-muted); font-style: italic; text-align: center; padding: 10px 0;">Немає доданих локацій</div>`;
                return;
            }

            currentGame.locations.forEach(loc => {
                const details = document.createElement('details');
                details.className = 'char-details';

                const currentLocationName = (currentGame.locationName || currentGame.location || '').trim().toLowerCase();
                const isCurrent = !!currentLocationName && !!loc.name && loc.name.trim().toLowerCase() === currentLocationName;

                const titleText = loc.name || (loc.description ? loc.description.trim().split('\n')[0].slice(0, 30) : 'Нова локація');

                details.innerHTML = `
                    <summary style="cursor: pointer; display: flex; align-items: center; gap: 8px;">
                        <span style="font-size: 15px;">📍</span>
                        <span style="flex: 1; overflow: hidden; text-overflow: ellipsis; font-weight: 500;">
                            ${titleText}
                        </span>
                        ${isCurrent ? `<span style="font-size: 11px; padding: 2px 7px; border-radius: 10px; background: var(--accent-color); color: white; white-space: nowrap;">Поточна</span>` : ''}
                        ${(!currentGame.isStarted || pendingManualLocationIds.includes(loc.id) || !!loc.pendingManualDeletion) ? `<button class="danger" style="padding: 1px 6px; font-size: 12px; margin-left: 4px;" onclick="deleteLocation(event, '${loc.id}')" title="Видалити локацію">✕</button>` : `<span title="Після початку гри локація заблокована" style="font-size: 12px; opacity: 0.45; margin-left: 4px; padding: 1px 6px;">🔒</span>`}
                    </summary>
                    <div class="char-details-body" style="padding-top: 8px;">
                        <div class="form-group" style="margin-bottom: 0;">
                            <label>Назва локації</label>
                            <input type="text" value="${loc.name || ''}" placeholder="Назва локації..." onchange="updateLocationName('${loc.id}', this.value)">
                        </div>
                        <div class="form-group" style="margin-bottom: 0;">
                            <label>Опис локації</label>
                            <textarea rows="5" placeholder="Опис локації..." onchange="updateLocationDescription('${loc.id}', this.value)">${loc.description || ''}</textarea>
                        </div>
                    </div>
                `;
                container.appendChild(details);
            });
        }

        /* Location helpers */
        function normalizeLocationName(name) {
            return String(name || '')
                .trim()
                .toLowerCase()
                .replace(/[«»“”„"']/g, '')
                .replace(/\s+/g, ' ');
        }

        function findKnownLocationByName(name) {
            if (!currentGame || !Array.isArray(currentGame.locations)) return null;
            const target = normalizeLocationName(name);
            if (!target) return null;
            return currentGame.locations.find(loc => normalizeLocationName(loc.name) === target) || null;
        }

        function setCurrentLocationByName(name, description = null) {
            if (!currentGame) return null;
            const cleanName = String(name || '').trim();
            if (!cleanName) return null;
            if (!Array.isArray(currentGame.locations)) currentGame.locations = [];

            const existing = findKnownLocationByName(cleanName);
            if (existing) {
                currentGame.locationName = existing.name;
                currentGame.location = existing.name;
                if (description !== null && String(description).trim()) {
                    existing.description = String(description).trim();
                }
                currentGame.locationDescription = existing.description || '';
                return existing;
            }

            const newLocation = {
                id: 'loc_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
                name: cleanName,
                description: description !== null ? String(description).trim() : ''
            };
            currentGame.locations.push(newLocation);
            currentGame.locationName = newLocation.name;
            currentGame.location = newLocation.name;
            currentGame.locationDescription = newLocation.description;
            return newLocation;
        }

        /* Helper to format full character profile for Gemini */
        function formatCharacterDetails(c, isPlayer = false) {
            let relText = "";
            if (!isPlayer && currentGame) {
                const playerChar = currentGame.characters.find(char => char.id === currentGame.playerCharId) || { name: "Гравець", id: "player" };
                const relToPlayer = getRelation(c, playerChar.id);
                const otherNPCs = currentGame.characters.filter(other => other.id !== c.id && other.id !== playerChar.id);
                const otherRels = otherNPCs.map(other => `    • До ${other.name} (ID: "${other.id}"): ${getRelation(c, other.id)}/100 (${getRelDescription(getRelation(c, other.id))})`).join('\n');

                relText = `\n  - ВІДНОШЕННЯ (0-100%):
    • До гравця ${playerChar.name} (ID: "${playerChar.id}"): ${relToPlayer}/100 [${getRelDescription(relToPlayer)}]${otherRels ? '\n' + otherRels : ''}`;
            }

            return `• ${isPlayer ? '[ГРАВЕЦЬ] ' : ''}ID: "${c.id}"
  - Ім'я: ${c.name || ''} ${c.surname || ''}
  - Раса: ${c.race || 'Людина'}
  - Стать: ${c.gender || 'Невідома'}
  - Вік: ${c.age || 'Невідомий'}
  - Роль / фах: ${c.role || 'Невідомо'}
  - ХАРАКТЕР (НАЙВИЩИЙ ПРІОРИТЕТ): ${c.personality || 'Звичайний'}
  - Зовнішність та спорядження: ${c.appearance || 'Звичайна'}${relText}`;
        }

        /* Checks whether an AI-proposed "new" character actually already exists in the game
           (matched by id, or by full name if no id / id not found), to avoid creating duplicates
           e.g. when the AI re-lists the player's existing companion as if newly introduced. */
        function findExistingCharacterMatch(nc) {
            if (!currentGame || !nc) return null;
            if (nc.id) {
                const byId = currentGame.characters.find(c => c.id === nc.id);
                if (byId) return byId;
            }
            if (nc.name) {
                const fullName = `${nc.name} ${nc.surname || ''}`.trim().toLowerCase();
                if (fullName) {
                    const byName = currentGame.characters.find(c => `${c.name || ''} ${c.surname || ''}`.trim().toLowerCase() === fullName);
                    if (byName) return byName;
                }
            }
            return null;
        }

        /* Helper to format recent conversation history */
        function formatRecentHistory(maxMessages = 10) {
            if (!currentGame || !currentGame.messages || currentGame.messages.length === 0) return "Історія поки що порожня.";
            const slice = currentGame.messages.slice(-maxMessages);
            return slice.map(m => {
                if (m.type === 'user') {
                    const p = currentGame.characters.find(c => c.id === currentGame.playerCharId);
                    const name = p ? `${p.name} ${p.surname}` : 'Гравець';
                    return `[${name}]: ${m.text}`;
                } else if (m.type === 'narration') {
                    return `[Оповідач]: ${m.text}`;
                } else if (m.type === 'character') {
                    const c = currentGame.characters.find(char => char.id === m.charId);
                    const name = c ? `${c.name} ${c.surname}` : (m.charName || 'Персонаж');
                    return `[${name}]: ${m.text}`;
                }
                return m.text;
            }).join('\n');
        }

        /* Deep clone helper for state snapshots (memory, relations, locations, etc.) */
        function deepClone(obj) {
            if (obj === undefined || obj === null) return obj;
            return JSON.parse(JSON.stringify(obj));
        }

        /* Capture a snapshot of the world state (memory, objectives, day, time, location, characters/relations)
           at the moment a user message is sent, so we can roll back to it if that message is later edited. */
        function captureWorldStateSnapshot() {
            if (!currentGame) return null;
            return {
                memory: currentGame.memory,
                objectives: currentGame.objectives,
                day: currentGame.day,
                timeOfDay: currentGame.timeOfDay,
                pendingDayTransition: currentGame.pendingDayTransition,
                location: currentGame.location,
                locationName: currentGame.locationName,
                locationDescription: currentGame.locationDescription,
                locations: deepClone(currentGame.locations),
                characters: deepClone(currentGame.characters)
            };
        }

        /* Restore a previously captured world state snapshot (used when editing a past user message). */
        function restoreWorldStateSnapshot(snapshot) {
            if (!currentGame || !snapshot) return;
            currentGame.memory = snapshot.memory;
            currentGame.objectives = snapshot.objectives;
            currentGame.day = snapshot.day;
            currentGame.timeOfDay = snapshot.timeOfDay;
            currentGame.pendingDayTransition = snapshot.pendingDayTransition;
            currentGame.location = snapshot.location;
            currentGame.locationName = snapshot.locationName;
            currentGame.locationDescription = snapshot.locationDescription;
            currentGame.locations = deepClone(snapshot.locations) || [];
            currentGame.characters = deepClone(snapshot.characters) || currentGame.characters;
        }

        /* Freeze the relationship value displayed on each character message. */
        function snapshotMessageRelations(startIndex = 0) {
            if (!currentGame || !Array.isArray(currentGame.messages)) return;
            for (let i = Math.max(0, startIndex); i < currentGame.messages.length; i++) {
                const message = currentGame.messages[i];
                if (!message || message.type !== 'character' || !message.charId) continue;
                const char = currentGame.characters.find(c => c.id === message.charId);
                if (!char || char.id === currentGame.playerCharId) continue;
                message.relationAtMessage = getRelation(char, currentGame.playerCharId);
            }
        }

        /* Message Rendering & Editing Last User Message in Input */
        function renderMessages(scrollMode = 'preserve') {
            const container = document.getElementById('chatMessages');
            if (!container) return;
            const prevScrollTop = container.scrollTop;
            container.innerHTML = '';
            if (!currentGame) {
                updateScrollToBottomVisibility();
                return;
            }

            const playerChar = currentGame.characters.find(c => c.id === currentGame.playerCharId) || { name: "Ти", surname: "", avatar: "" };
            const playerAvatar = playerChar.avatar || FALLBACK_AVATAR;

            // Find index of last user message
            let lastUserIdx = -1;
            for (let i = currentGame.messages.length - 1; i >= 0; i--) {
                if (currentGame.messages[i].type === 'user') {
                    lastUserIdx = i;
                    break;
                }
            }

            currentGame.messages.forEach((m, idx) => {
                const div = document.createElement('div');

                if (m.type === 'user') {
                    div.className = 'message user';
                    const isLastUser = (idx === lastUserIdx);
                    div.innerHTML = `
                        <div class="char-header user-header">
                            ${isLastUser ? `<button class="btn-edit-msg" onclick="editLastUserMessage(${idx})" title="Редагувати в полі вводу">✏️</button>` : ''}
                            <span class="char-name">${playerChar.name || ''} ${playerChar.surname || ''}</span>
                            ${renderAvatarTag(playerAvatar)}
                        </div>
                        <div class="char-text">${m.text}</div>
                    `;
                } else if (m.type === 'narration') {
                    div.className = 'message narration';
                    div.innerHTML = `<div>${m.text}</div>`;
                } else if (m.type === 'character') {
                    div.className = 'message character';
                    const char = currentGame.characters.find(c => c.id === m.charId) || { name: m.charName || "Персонаж", surname: "", avatar: "", id: m.charId || 'default' };
                    const avatarSrc = char.avatar || FALLBACK_AVATAR;
                    const isPlayer = char.id === currentGame.playerCharId;
                    const storedRelation = Number(m.relationAtMessage);
                    const relToPlayer = Number.isFinite(storedRelation) ? storedRelation : getRelation(char, currentGame.playerCharId);
                    const relBadge = !isPlayer
                        ? `<span class="rel-badge ${getRelClass(relToPlayer)}" title="Відношення до вас: ${relToPlayer}% (${getRelDescription(relToPlayer)})">${getRelIcon(relToPlayer)} ${relToPlayer}%</span>`
                        : '';

                    div.innerHTML = `
                        <div class="char-header">
                            ${renderAvatarTag(avatarSrc)}
                            <span class="char-name">${char.name || ''} ${char.surname || ''}</span>
                            ${relBadge}
                        </div>
                        <div class="char-text">${m.text}</div>
                    `;
                }
                container.appendChild(div);
            });

            // Action Buttons after AI Response
            if (currentGame.isStarted && currentGame.messages.length > 0) {
                const lastMsg = currentGame.messages[currentGame.messages.length - 1];
                if (lastMsg.type === 'narration' || lastMsg.type === 'character') {
                    const actionBar = document.createElement('div');
                    actionBar.className = 'ai-action-bar';
                    actionBar.innerHTML = `
                        <button class="ai-action-btn" onclick="triggerContinue()">⏩ Продовжити</button>
                        <button class="ai-action-btn" onclick="triggerOptions()">💡 Варіанти</button>
                    `;
                    container.appendChild(actionBar);

                    if (currentOptions.length > 0) {
                        const optionsBox = document.createElement('div');
                        optionsBox.className = 'options-list';
                        currentOptions.forEach(opt => {
                            const pill = document.createElement('div');
                            pill.className = 'option-pill';
                            pill.innerText = opt;
                            pill.onclick = () => selectOption(opt);
                            optionsBox.appendChild(pill);
                        });
                        container.appendChild(optionsBox);
                    }
                }
            }

            if (!currentGame.isStarted) {
                const startBtnDiv = document.createElement('div');
                startBtnDiv.style.display = 'flex';
                startBtnDiv.style.justifyContent = 'center';
                startBtnDiv.style.margin = '20px 0';

                const startBtn = document.createElement('button');
                startBtn.innerText = '▶ Почати гру';
                startBtn.style.padding = '12px 24px';
                startBtn.style.fontSize = '16px';
                startBtn.onclick = handleStartGameButton;

                startBtnDiv.appendChild(startBtn);
                container.appendChild(startBtnDiv);
            }

            if (scrollMode === 'bottom') {
                container.scrollTop = container.scrollHeight;
            } else if (scrollMode === 'top') {
                container.scrollTop = 0;
            } else {
                container.scrollTop = prevScrollTop;
            }

            updateScrollToBottomVisibility();
        }

        /* Edit last user message directly inside the input box */
        async function editLastUserMessage(index) {
            if (!currentGame || !currentGame.messages[index]) return;
            const oldMessage = currentGame.messages[index];
            const oldText = oldMessage.text;

            // Roll back memory, objectives, day/time, locations and character relations
            // to how they were right before this message was sent, undoing anything the
            // AI added/changed as a *consequence* of this message (and any later ones).
            if (oldMessage.stateSnapshot) {
                restoreWorldStateSnapshot(oldMessage.stateSnapshot);
            }

            // Remove this message and subsequent messages
            currentGame.messages = currentGame.messages.slice(0, index);

            // Any "pending" (not-yet-confirmed) character/location bookkeeping tied to
            // messages we just erased is no longer relevant.
            pendingNewCharIds = [];
            pendingManualCharIds = [];
            pendingManualLocationIds = [];

            await dbSaveGame(currentGame);
            renderAll('bottom');

            // Put into input field and focus
            const inputArea = document.getElementById('userInput');
            inputArea.value = oldText;
            inputArea.style.height = 'auto';
            inputArea.style.height = Math.min(inputArea.scrollHeight, 200) + 'px';
            inputArea.focus();
        }

        /* ==========================================
           6. GEMINI API & GAME LOGIC
           ========================================== */
        async function handleStartGameButton() {
            const apiKey = document.getElementById('apiKey').value;
            const selectedModel = document.getElementById('modelSelect').value;

            if (!apiKey) return alert("Вкажіть Gemini API Key у боковій панелі!");
            if (!currentGame) return;

            setStatus(true, "Генерація старту пригоди...");
            const playerChar = currentGame.characters.find(c => c.id === currentGame.playerCharId) || currentGame.characters[0];
            const otherCharacters = currentGame.characters.filter(c => c.id !== playerChar.id);

            const systemPrompt = `
Ти — майстер інтерактивного рольового квесту.
НАЗВА КВЕСТУ: ${currentGame.title}
ПОТОЧНИЙ ДЕНЬ: День ${currentGame.day || 1} (Обов'язково враховуй поточний день у відповіді!)
ПОТОЧНА ЛОКАЦІЯ: ${currentGame.locationName || currentGame.location}
ОПИС ПОТОЧНОЇ ЛОКАЦІЇ: ${currentGame.locationDescription || ''}
ПОТОЧНИЙ ЧАС ДОБИ: ${currentGame.timeOfDay} (Обов'язково відповідай цьому часу доби!)
ЦІЛІ КВЕСТУ: ${currentGame.objectives}
ПАМ'ЯТЬ КВЕСТУ: ${currentGame.memory}

ПЕРСОНАЖІ:
${formatCharacterDetails(playerChar, true)}

${otherCharacters.map(c => formatCharacterDetails(c, false)).join('\n\n')}

ПРАВИЛА:
1. ХАРАКТЕРИ ПЕРСОНАЖІВ — НАЙВИЩИЙ ПРІОРИТЕТ. Поведінка, реакції та мова повинні суворо відповідати їхнім характерам (наприклад: гордість, сарказм, йогоїзм, імпульсивність мають чітко проявлятися).
2. ДЕНЬ ТА ЧАС ДОБИ: Обов'язково враховуй поточний день (День ${currentGame.day || 1}) та час доби (${currentGame.timeOfDay}) при створенні стартової атмосфери, початку подій та опису оточення.
3. ВІДНОШЕННЯ (0-100%): Враховуй поточний рівень симпатії/довіри між персонажами.
   - При відношенні 85-94%: між персонажем та гравцем різної статі можуть виникати романтичні почуття — флірт, ніжність, натяки на взаємний потяг.
   - При відношенні 95-100%: можлива інтимна близькість між персонажем та гравцем (якщо вони різної статі та це органічно випливає з ситуації). Описуй художньо, але відверто та без цензури.
4. НОВІ ПЕРСОНАЖІ: Якщо на старті з'являються додаткові особи (наприклад, вороги, вартові, свідки), опиши їх у масиві "newCharacters".
   ВАЖЛИВО: у "newCharacters" вказуй ТІЛЬКИ персонажів, яких немає у переліку "ПЕРСОНАЖІ" вище. Гравця та вже перелічених персонажів (наприклад, супутника) НЕ додавай туди повторно.
   Встанови "initialRelationToPlayer" (0-100%):
   - Вороги, розбійники, монстри: 0-20% (ворожість/ненависть)
   - Підозрілі чужинці: 25-40%
   - Нейтральні містяни: 45-55%
   - Союзники/врятовані: 60-80%
5. Згенеруй стартову сцену, що занурює гравця в атмосферу та створює початковий виклик.
6. ЛОКАЦІЇ: Назву та опис стартової локації зберігай ОКРЕМО. У відповіді для початкових даних обов'язково поверни "locationName" як коротку назву та "locationDescription" як детальний опис. Не змішуй назву з описом.

Поверни JSON:
{
  "messages": [{ "type": "narration", "text": "Опис початкової ситуації..." }],
  "newCharacters": [
    {
      "id": "char_id",
      "name": "Ім'я",
      "surname": "Прізвище",
      "race": "Людина/Ельф...",
      "gender": "Чоловіча/Жіноча/Інша",
      "age": 30,
      "role": "Роль",
      "personality": "Характер",
      "appearance": "Зовнішність",
      "initialRelationToPlayer": 15
    }
  ] або null,
  "newLocations": [
    {
      "name": "Назва локації",
      "description": "Детальний художній опис локації..."
    }
  ] або null,
  "updatedMemory": "Оновлена пам'ять або null",
  "updatedObjectives": "Оновлені цілі або null",
  "updatedRelations": null,
  "newLocation": null,
  "newTimeOfDay": null
}`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${selectedModel}:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ role: "user", parts: [{ text: systemPrompt }] }],
                        generationConfig: { responseMimeType: "application/json" }
                    })
                });

                if (!response.ok) throw new Error("HTTP " + response.status);
                const data = await response.json();
                const result = JSON.parse(data.candidates[0].content.parts[0].text);

                currentGame.isStarted = true;
                currentGame.day = typeof currentGame.day === 'number' && currentGame.day >= 1 ? currentGame.day : 1;
                currentGame.messages = [];
                const openingMessageStartIndex = 0;

                // Add any new characters created at start
                if (result.newCharacters && Array.isArray(result.newCharacters)) {
                    result.newCharacters.forEach(nc => {
                        if (!nc || !nc.name) return;
                        if (findExistingCharacterMatch(nc)) return; // already exists, don't duplicate
                        const newId = nc.id || ('char_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4));
                        let initRel = 50;
                        if (nc.initialRelationToPlayer !== undefined && nc.initialRelationToPlayer !== null) {
                            initRel = Math.max(0, Math.min(100, parseInt(nc.initialRelationToPlayer) || 50));
                        } else if (nc.role && /ворог|розбійник|бандит|вбивця|монстр|культист|нападник/i.test(nc.role)) {
                            initRel = 15;
                        }

                        const newCharObj = {
                            id: newId,
                            name: nc.name,
                            surname: nc.surname || "",
                            race: nc.race || "Людина",
                            gender: nc.gender || "Інша",
                            age: parseInt(nc.age) || 25,
                            role: nc.role || "Незнайомець",
                            personality: nc.personality || "Звичайний",
                            appearance: nc.appearance || "Звичайна",
                            relations: { [currentGame.playerCharId]: initRel }
                        };
                        newCharObj.avatar = buildAvatarUrl(newCharObj);
                        currentGame.characters.push(newCharObj);
                    });
                }

                if (result.messages && Array.isArray(result.messages)) {
                    result.messages.forEach(msg => {
                        if (msg.type === 'narration') currentGame.messages.push({ type: 'narration', text: msg.text });
                        else if (msg.type === 'character') {
                            const char = currentGame.characters.find(c => c.id === msg.charId) || currentGame.characters[0];
                            currentGame.messages.push({ type: 'character', charId: char.id, text: msg.text });
                        }
                    });
                }
                snapshotMessageRelations(openingMessageStartIndex);
                if (result.updatedMemory) currentGame.memory = result.updatedMemory;
                if (result.updatedObjectives) currentGame.objectives = result.updatedObjectives;
                if (result.newLocation && result.newLocation.trim()) {
                    setCurrentLocationByName(result.newLocation.trim());
                }
                if (!Array.isArray(currentGame.locations)) currentGame.locations = [];
                if (result.newLocations && Array.isArray(result.newLocations)) {
                    result.newLocations.forEach(nl => {
                        if (!nl) return;
                        const locName = (typeof nl === 'string' ? nl : (nl.name || '')).trim();
                        const locDesc = (typeof nl === 'string' ? nl : (nl.description || nl.name || '')).trim();
                        if (!locDesc) return;
                        const existing = findKnownLocationByName(locName) || currentGame.locations.find(l =>
                            locDesc && l.description && l.description.trim().toLowerCase() === locDesc.toLowerCase()
                        );
                        if (!existing) {
                            currentGame.locations.push({
                                id: 'loc_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
                                name: locName || locDesc.split('\n')[0].slice(0, 35),
                                description: locDesc
                            });
                        } else if (locDesc && (!existing.description || existing.description === existing.name)) {
                            existing.description = locDesc;
                        }
                        if (locName && locName.toLowerCase() === (currentGame.locationName || currentGame.location || '').toLowerCase()) {
                            currentGame.locationName = locName;
                            currentGame.location = locName;
                            currentGame.locationDescription = locDesc;
                        }
                    });
                }
                if (currentGame.location && !currentGame.locations.some(l => l.name && l.name.toLowerCase() === currentGame.location.toLowerCase())) {
                    currentGame.locations.push({
                        id: 'loc_' + Date.now(),
                        name: currentGame.location,
                        description: currentGame.location
                    });
                }

                        currentGame.day = (currentGame.day || 1) + 1;
                        dayWasSet = true;
                    }
                }
                if (dayWasSet) updateDayDisplay();

                if (result.newTimeOfDay && TIME_STEPS.includes(result.newTimeOfDay)) {
                    currentGame.timeOfDay = result.newTimeOfDay;
                    currentGame.pendingDayTransition = false;
                }

                if (result.updatedObjectives && typeof result.updatedObjectives === 'string' && result.updatedObjectives.trim()) {
                    currentGame.objectives = result.updatedObjectives.trim();
                }

                if (result.newMemoryEntry && typeof result.newMemoryEntry === 'string' && result.newMemoryEntry.trim()) {

                    const dayPrefixRegex = /^\[?\s*день\s*\d+[^:]*:\s*/i;

                    const locName = currentGame.location || 'Локація';
                    const formattedEntry = `День ${currentGame.day || 1}, ${currentGame.timeOfDay}, ${locName}: ${cleanedText}`;
                    currentGame.memory = (currentGame.memory ? currentGame.memory + "\n• " : "• ") + formattedEntry;
                }

                await dbSaveGame(currentGame);
                renderAll('preserve');
            } catch (err) {
                alert(`Помилка: ${err.message}`);
            } finally {
                setStatus(false);
            }
        }

        async function sendMessage() {
            const inputArea = document.getElementById('userInput');
            const text = inputArea.value.trim();
            if (!text || !currentGame || !currentGame.isStarted || isGenerating) return;

            if (currentGame.pendingDayTransition && currentGame.timeOfDay === "Ранок") {
                currentGame.day = (currentGame.day || 1) + 1;
                currentGame.pendingDayTransition = false;
                updateDayDisplay();
            }

            currentOptions = [];
            // Sending a player message closes the temporary deletion window.
            pendingNewCharIds = [];
            pendingManualCharIds = [];
            pendingManualLocationIds = [];
            currentGame.characters.forEach(c => {
                if (c.pendingManualDeletion) delete c.pendingManualDeletion;
            });
            if (Array.isArray(currentGame.locations)) {
                currentGame.locations.forEach(l => {
                    if (l.pendingManualDeletion) delete l.pendingManualDeletion;
                });
            }
            const stateSnapshot = captureWorldStateSnapshot();
            currentGame.messages.push({ type: 'user', text: text, stateSnapshot: stateSnapshot });
            inputArea.value = '';
            inputArea.style.height = 'auto';
            renderMessages('bottom');
            await dbSaveGame(currentGame);

            await callGemini(text);
        }

        /* Action Buttons: Continue, Options */
        async function triggerContinue() {
            if (isGenerating) return;
            if (currentGame && currentGame.pendingDayTransition && currentGame.timeOfDay === "Ранок") {
                currentGame.day = (currentGame.day || 1) + 1;
                currentGame.pendingDayTransition = false;
                updateDayDisplay();
                await dbSaveGame(currentGame);
            }
            currentOptions = [];
            await callGemini("Продовжуй події далі...");
        }

        async function triggerOptions() {
            if (isGenerating) return;

            if (currentOptions.length > 0) {
                currentOptions = [];
                renderMessages();
                return;
            }

            const apiKey = document.getElementById('apiKey').value;
            const selectedModel = document.getElementById('modelSelect').value;
            if (!apiKey) return alert("Вкажіть API Key!");

            setStatus(true, "Генерація 5 варіантів дій...");

            const playerChar = currentGame.characters.find(c => c.id === currentGame.playerCharId) || { name: "Гравець", personality: "", gender: "", age: "", role: "", appearance: "" };
            const promptText = `На основі поточної ситуації в грі (Поточний день: День ${currentGame.day || 1}, Локація: ${currentGame.location}, Час доби: ${currentGame.timeOfDay}, Пам'ять: ${currentGame.memory}) запропонуй рівно 5 різних можливих варіантів дій або реплік для мого персонажа ${playerChar.name} (стать: ${playerChar.gender || 'не вказана'}, вік: ${playerChar.age || 'не вказаний'}, роль/фах: ${playerChar.role || 'не вказана'}, зовнішність: ${playerChar.appearance || 'не вказана'}, характер: ${playerChar.personality || 'звичайний'}). 
Останній контекст:
${formatRecentHistory(5)}

ВАЖЛИВО: Кожен варіант ОБОВ'ЯЗКОВО пиши від першої особи (від імені гравця), так, ніби це сам гравець описує свою дію або репліку. Наприклад: "Я підходжу ближче і питаю, що тут сталося." або "Я кажу: «Довірся мені»." Не використовуй третю особу (не пиши "Персонаж підходить..." чи "${playerChar.name} питає...").
ОБОВ'ЯЗКОВО узгоджуй рід дієслів минулого/доконаного виду з статтю персонажа (${playerChar.gender || 'не вказана'}): якщо стать "Чоловіча" — використовуй чоловічий рід (напр. "я підійшов", "я сказав", "я зробив"); якщо стать "Жіноча" — жіночий рід (напр. "я підійшла", "я сказала", "я зробила").
Враховуй вік, роль/фах та зовнішність персонажа: варіанти дій мають відповідати його можливостям, манері поведінки та тому, як він фізично міг би діяти в цій ситуації (наприклад, персонаж у важких обладунках навряд чи непомітно прокрадеться, а досвідчений майстер певного фаху може запропонувати дію, пов'язану з цим фахом).

Поверни JSON: { "options": ["варіант 1 від першої особи", "варіант 2 від першої особи", "варіант 3 від першої особи", "варіант 4 від першої особи", "варіант 5 від першої особи"] }`;

            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${selectedModel}:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ role: "user", parts: [{ text: promptText }] }],
                        generationConfig: { responseMimeType: "application/json" }
                    })
                });

                if (res.ok) {
                    const data = await res.json();
                    const result = JSON.parse(data.candidates[0].content.parts[0].text);
                    if (result.options) currentOptions = result.options;
                }
            } catch (e) {
                console.error(e);
            } finally {
                setStatus(false);
                renderMessages();
            }
        }

        function selectOption(optText) {
            userInput.value = optText;
            currentOptions = [];
            userInput.style.height = 'auto';
            userInput.style.height = Math.min(userInput.scrollHeight, 200) + 'px';
            userInput.focus();
            renderMessages();
        }

        /* Global Init */
        window.onload = async () => {
            initTheme();
            initSidebarHeaderState();
            loadApiKey();
            loadSelectedModel();
            await initDB();
            await refreshGameList();
        };
    </script>
</body>

</html>
